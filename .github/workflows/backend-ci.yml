name: Scarlet Backend CI

on:
  push:
    branches:
      - feature/raven-security-integration
      - feature/raven-security-shield
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nexus -d nexus"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: nexus-scarlet/backend

    env:
      DATABASE_URL: postgres://nexus:nexus@localhost:5432/nexus
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nexus-scarlet/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npm run db:migrate

      - name: Seed database
        run: npm run db:seed

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Run security tests
        run: npx vitest run tests/security/

      - name: Build
        run: npm run build